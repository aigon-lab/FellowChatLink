<title>Chat.html ― フェイスミニブック</title>
<style>
  :root{
    --bg:#0a1130;
    --bg-deep:#070d24;
    --surface:#16204a;
    --surface-2:#1d2a5c;
    --surface-3:#24336e;
    --gold:#d9b64a;
    --gold-bright:#eccd6d;
    --gold-ink:#231a02;
    --text:#f4f1e6;
    --muted:#a9b1d6;
    --muted-2:#7f88b3;
    --danger:#ff8f8a;
    --radius:20px;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--bg-deep);
    color:var(--text);
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Yu Gothic","Noto Sans JP",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button,[role="button"],select,summary,input:not([type="checkbox"],[type="radio"]),textarea{ min-height:2.25rem; }
  button{ font-family:inherit; cursor:pointer; }
  input,textarea,select{ font-family:inherit; }

  .app{ max-width:560px; margin:0 auto; min-height:100dvh; background:var(--bg); display:flex; flex-direction:column; position:relative; }
  @media (min-width:640px){
    .app{ box-shadow:0 0 60px rgba(0,0,0,.55); }
  }

  /* ---------- 入室画面 ---------- */
  .entry{ flex:1; display:flex; flex-direction:column; align-items:center; padding:48px 28px 40px; }
  .medallion{
    width:118px; height:118px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #2a3a7d, #141f49 70%);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 0 2px rgba(217,182,74,.55), 0 14px 34px rgba(0,0,0,.5);
    border:none; padding:0; margin-top:12px;
  }
  .medallion svg{ width:58px; height:58px; }
  .entry h1{
    margin:26px 0 2px; font-size:1.55rem; letter-spacing:.14em; font-weight:700; color:var(--gold-bright);
    text-align:center;
  }
  .entry .sub{ margin:0; color:var(--text); font-size:1.02rem; letter-spacing:.3em; text-align:center; }
  .entry .lab{ margin-top:10px; color:var(--muted-2); font-size:.78rem; letter-spacing:.34em; }
  .entry-card{ width:100%; margin-top:38px; background:var(--surface); border-radius:var(--radius); padding:24px 20px 20px; }
  .entry-card h2{ margin:0 0 6px; font-size:1.08rem; font-weight:700; }
  .entry-card p.note{ margin:0 0 16px; color:var(--muted); font-size:.88rem; line-height:1.7; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:.86rem; color:var(--muted); margin-bottom:6px; }
  .field input{
    width:100%; background:var(--bg); border:none; border-radius:12px; color:var(--text);
    padding:12px 14px; font-size:1rem; outline:none;
  }
  .field input:focus{ box-shadow:0 0 0 2px rgba(217,182,74,.6); }
  .btn-gold{
    width:100%; background:linear-gradient(180deg,var(--gold-bright),var(--gold)); color:var(--gold-ink);
    border:none; border-radius:999px; font-size:1.05rem; font-weight:700; padding:13px 16px; margin-top:6px;
  }
  .btn-gold:active{ transform:scale(.99); }
  .entry .foot{ margin-top:auto; padding-top:28px; color:var(--muted-2); font-size:.8rem; text-align:center; line-height:1.8; }
  .err{ color:var(--danger); font-size:.88rem; min-height:1.2em; margin:4px 0 0; }

  /* ---------- 部屋の共通枠 ---------- */
  .room{ flex:1; display:none; flex-direction:column; min-height:100dvh; }
  .room.on{ display:flex; }
  .topbar{
    display:flex; align-items:center; gap:10px; padding:12px 16px 8px;
  }
  .topbar .screen-name{ font-size:1.12rem; font-weight:700; }
  .topbar .who{ margin-left:auto; color:var(--muted); font-size:.92rem; white-space:nowrap; }
  .badge-admin{ background:var(--surface-3); color:var(--gold-bright); border-radius:999px; padding:3px 10px; font-size:.78rem; font-weight:700; }
  .icon-btn{
    background:transparent; border:none; color:var(--text); width:44px; height:44px;
    display:flex; align-items:center; justify-content:center; border-radius:12px; flex:none;
  }
  .icon-btn svg{ width:24px; height:24px; }

  .view{ flex:1; display:none; flex-direction:column; min-height:0; }
  .view.on{ display:flex; }
  .scroll{ flex:1; overflow-y:auto; padding:6px 16px 18px; }

  /* ---------- 会話 ---------- */
  .msgs{ display:flex; flex-direction:column; gap:18px; padding-top:8px; }
  .msg{ display:flex; gap:10px; align-items:flex-start; }
  .msg.own{ flex-direction:row-reverse; }
  .avatar{
    width:42px; height:42px; border-radius:50%; background:var(--surface-3); color:var(--gold-bright);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:1rem; flex:none;
  }
  .msg-col{ max-width:76%; display:flex; flex-direction:column; }
  .msg.own .msg-col{ align-items:flex-end; }
  .msg-name{ font-size:.8rem; color:var(--muted); margin:0 2px 4px; }
  .bubble{
    background:var(--surface-2); color:var(--text); border-radius:18px; padding:11px 14px;
    font-size:1rem; line-height:1.65; white-space:pre-wrap; word-break:break-word; position:relative;
  }
  .msg.own .bubble{ background:linear-gradient(180deg,var(--gold-bright),var(--gold)); color:var(--gold-ink); }
  .bubble img.thumb{ display:block; max-width:210px; width:100%; border-radius:12px; margin-bottom:8px; cursor:zoom-in; }
  .bubble .filechip{
    display:flex; align-items:center; gap:8px; background:rgba(0,0,0,.18); border-radius:10px;
    padding:9px 12px; margin-bottom:8px; font-size:.92rem; text-decoration:underline; cursor:pointer; word-break:break-all;
  }
  .msg-meta{ display:flex; align-items:center; gap:10px; margin-top:5px; font-size:.78rem; color:var(--muted-2); padding:0 2px; }
  .msg-meta button{ background:none; border:none; color:var(--muted); font-size:.78rem; text-decoration:underline; padding:6px 2px; min-height:2rem; }
  .chips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .chip{
    background:var(--surface-3); border:none; color:var(--text); border-radius:999px;
    font-size:.82rem; padding:5px 10px; min-height:2rem; display:inline-flex; align-items:center; gap:5px;
  }
  .chip.mine{ background:var(--gold); color:var(--gold-ink); font-weight:700; }
  .react-add{
    background:var(--surface); border:none; color:var(--muted); border-radius:999px;
    width:2rem; height:2rem; font-size:1rem; line-height:1; display:inline-flex; align-items:center; justify-content:center;
  }
  .picker{
    display:none; gap:4px; background:var(--surface-3); border-radius:999px; padding:5px 8px; margin-top:6px;
    box-shadow:0 8px 22px rgba(0,0,0,.45); width:max-content;
  }
  .picker.on{ display:flex; }
  .picker button{ background:none; border:none; font-size:1.25rem; width:2.4rem; height:2.4rem; border-radius:50%; }
  .picker button:active{ background:rgba(255,255,255,.12); }

  .composer{ padding:10px 12px calc(12px + env(safe-area-inset-bottom)); display:flex; gap:8px; align-items:flex-end; }
  .plus-btn{
    width:48px; height:48px; border-radius:50%; background:var(--surface); border:none; color:var(--text);
    font-size:1.6rem; line-height:1; flex:none; display:flex; align-items:center; justify-content:center;
  }
  .composer textarea{
    flex:1; background:var(--surface); border:none; border-radius:24px; color:var(--text);
    padding:13px 16px; font-size:1rem; resize:none; max-height:120px; outline:none; line-height:1.5;
  }
  .composer textarea:focus{ box-shadow:0 0 0 2px rgba(217,182,74,.55); }
  .send-btn{
    background:linear-gradient(180deg,var(--gold-bright),var(--gold)); color:var(--gold-ink); border:none;
    border-radius:999px; font-weight:700; font-size:1rem; padding:12px 20px; flex:none; min-height:48px;
  }
  .pending{
    display:none; margin:0 12px; background:var(--surface); border-radius:14px; padding:10px 12px;
    align-items:center; gap:10px; font-size:.88rem; color:var(--muted);
  }
  .pending.on{ display:flex; }
  .pending img{ width:44px; height:44px; object-fit:cover; border-radius:8px; }
  .pending button{ margin-left:auto; background:none; border:none; color:var(--danger); font-size:.9rem; padding:8px; }

  /* ---------- 引き出し（＋） ---------- */
  .sheet-veil{ position:fixed; inset:0; background:rgba(3,6,18,.6); display:none; z-index:40; }
  .sheet-veil.on{ display:block; }
  .sheet{
    position:fixed; left:50%; transform:translate(-50%,105%); bottom:0; width:min(560px,100%);
    background:var(--surface); border-radius:24px 24px 0 0; padding:14px 18px calc(20px + env(safe-area-inset-bottom));
    transition:transform .28s ease; z-index:41;
  }
  .sheet.on{ transform:translate(-50%,0); }
  .sheet .grab{ width:44px; height:5px; border-radius:99px; background:var(--surface-3); margin:2px auto 14px; }
  .sheet button.row{
    width:100%; display:flex; align-items:center; gap:14px; background:none; border:none; color:var(--text);
    font-size:1.05rem; padding:14px 6px; text-align:left; min-height:52px;
  }
  .sheet button.row svg{ width:24px; height:24px; flex:none; }

  /* ---------- ハンバーガーメニュー ---------- */
  .menu{
    position:fixed; top:0; right:0; height:100dvh; width:min(300px,84vw); background:var(--surface);
    transform:translateX(105%); display:none; transition:transform .28s ease; z-index:50; padding:22px 20px;
    flex-direction:column; gap:4px;
  }
  .menu.prep{ display:flex; }
  .menu.on{ transform:translateX(0); }
  .menu h3{ margin:2px 0 14px; font-size:.85rem; color:var(--muted); letter-spacing:.18em; font-weight:700; }
  .menu button{
    background:none; border:none; color:var(--text); text-align:left; font-size:1.08rem;
    padding:14px 10px; border-radius:12px; min-height:52px;
  }
  .menu button.cur{ background:var(--surface-2); color:var(--gold-bright); font-weight:700; }
  .menu .close-row{ display:flex; justify-content:flex-end; margin-bottom:4px; }

  /* ---------- 一覧（プロンプト集・ツール倉庫） ---------- */
  .list-head{ display:flex; align-items:center; gap:10px; margin:6px 0 14px; }
  .list-head p{ margin:0; color:var(--muted); font-size:.9rem; line-height:1.6; flex:1; }
  .add-btn{
    background:linear-gradient(180deg,var(--gold-bright),var(--gold)); color:var(--gold-ink); border:none;
    border-radius:999px; font-weight:700; padding:11px 18px; font-size:.95rem; flex:none;
  }
  .card{ background:var(--surface); border-radius:var(--radius); padding:18px; margin-bottom:14px; cursor:pointer; }
  .card h3{ margin:0 0 6px; font-size:1.08rem; }
  .card p{ margin:0; color:var(--muted); font-size:.9rem; line-height:1.65; }
  .card .meta{ margin-top:10px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .tag{ background:var(--surface-3); color:var(--gold-bright); font-size:.76rem; border-radius:999px; padding:4px 10px; }
  .tag-private{ background:var(--bg); color:var(--muted); font-size:.76rem; border-radius:999px; padding:4px 10px; }
  .card .by{ color:var(--muted-2); font-size:.78rem; }
  .card img.card-img{ width:100%; border-radius:12px; margin-bottom:12px; display:block; }

  /* ---------- 詳細・フォーム ---------- */
  .back-link{ background:none; border:none; color:var(--gold-bright); font-size:.95rem; padding:10px 0; text-align:left; }
  .detail h2{ margin:4px 0 8px; font-size:1.3rem; line-height:1.45; }
  .detail .desc{ color:var(--muted); line-height:1.75; margin:0 0 14px; }
  .detail img{ width:100%; border-radius:14px; margin-bottom:14px; display:block; }
  pre.body{
    background:var(--bg-deep); border-radius:14px; padding:16px; white-space:pre-wrap; word-break:break-word;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; font-size:.86rem; line-height:1.7; color:#e8e4d2;
    max-height:52vh; overflow:auto; margin:0 0 14px;
  }
  .detail .actions{ display:flex; gap:10px; flex-wrap:wrap; }
  .btn-sub{
    background:var(--surface-2); color:var(--text); border:none; border-radius:999px;
    padding:11px 18px; font-size:.95rem; min-height:48px;
  }
  .btn-danger{ background:var(--surface-2); color:var(--danger); border:none; border-radius:999px; padding:11px 18px; font-size:.95rem; min-height:48px; }
  .toast{
    position:fixed; left:50%; bottom:28px; transform:translate(-50%,20px); background:var(--surface-3); color:var(--text);
    padding:12px 20px; border-radius:999px; font-size:.92rem; opacity:0; pointer-events:none; transition:.25s; z-index:80;
    box-shadow:0 10px 30px rgba(0,0,0,.5); max-width:88vw; text-align:center;
  }
  .toast.on{ opacity:1; transform:translate(-50%,0); }
  form.tool-form .field input, form.tool-form .field textarea, form.tool-form .field select{
    width:100%; background:var(--bg); border:none; border-radius:12px; color:var(--text); padding:12px 14px; font-size:1rem; outline:none;
  }
  form.tool-form .field textarea{ min-height:150px; resize:vertical; line-height:1.6; }
  form.tool-form .field input:focus, form.tool-form .field textarea:focus{ box-shadow:0 0 0 2px rgba(217,182,74,.6); }

  /* ---------- 設定 ---------- */
  .set-block{ background:var(--surface); border-radius:var(--radius); padding:20px; margin-bottom:16px; }
  .set-block h3{ margin:0 0 10px; font-size:1.12rem; }
  .set-block p{ margin:0 0 10px; color:var(--muted); line-height:1.8; font-size:.94rem; }
  .set-block p:last-child{ margin-bottom:0; }
  .set-block .gold-h{ color:var(--gold-bright); font-weight:700; margin-top:14px; }
  .set-block .gold-h:first-of-type{ margin-top:4px; }
  .ledger-row{ background:var(--bg); border-radius:14px; padding:14px 16px; margin-bottom:12px; }
  .ledger-row .nick{ font-size:1.1rem; font-weight:700; display:flex; align-items:center; gap:10px; }
  .ledger-row .shop{ color:var(--muted); margin-top:2px; }
  .ledger-row .date{ color:var(--muted); font-size:.88rem; margin-top:2px; }
  .status-on{ color:#8fd694; font-size:.8rem; font-weight:700; }
  .status-off{ color:var(--danger); font-size:.8rem; font-weight:700; }
  .mini-btn{ background:var(--surface-3); color:var(--danger); border:none; border-radius:10px; padding:8px 14px; font-size:.88rem; font-weight:700; margin-left:auto; }

  /* ---------- カメラ・拡大表示 ---------- */
  .cam-veil{ position:fixed; inset:0; background:#000; z-index:70; display:none; flex-direction:column; }
  .cam-veil.on{ display:flex; }
  .cam-veil video{ flex:1; width:100%; object-fit:cover; background:#000; }
  .cam-bar{ display:flex; justify-content:space-between; align-items:center; padding:18px 22px calc(22px + env(safe-area-inset-bottom)); }
  .cam-bar button{ border:none; border-radius:999px; font-size:1rem; padding:13px 22px; min-height:52px; }
  .cam-cancel{ background:var(--surface-2); color:var(--text); }
  .cam-shot{ background:linear-gradient(180deg,var(--gold-bright),var(--gold)); color:var(--gold-ink); font-weight:700; }
  .zoom-veil{ position:fixed; inset:0; background:rgba(2,4,12,.94); z-index:70; display:none; align-items:center; justify-content:center; }
  .zoom-veil.on{ display:flex; }
  .zoom-veil img{ max-width:94vw; max-height:88dvh; border-radius:14px; }
  .zoom-veil button{ position:absolute; top:16px; right:16px; background:var(--surface-2); color:var(--text); border:none; border-radius:999px; padding:11px 18px; font-size:.95rem; }
  .hidden-input{ display:none; }
</style>
</head>
<body>
<div class="app">

  <!-- ===== 入室画面 ===== -->
  <section class="entry" id="entryScreen">
    <button class="medallion" id="keyMedallion" aria-label="鍵">
      <svg viewBox="0 0 24 24" fill="none" stroke="#eccd6d" stroke-width="1.7" stroke-linecap="round">
        <circle cx="8" cy="8" r="4.6"/>
        <path d="M11.3 11.3 L20 20"/><path d="M16.6 16.6 L19.4 13.8"/><path d="M14.2 14.2 L16.8 11.6"/>
      </svg>
    </button>
    <h1>FellowChatLink</h1>
    <p class="sub">フェイスミニブック</p>
    <p class="lab">AIGON.LAB</p>

    <div class="entry-card" id="memberEntry">
      <h2>部屋に入る</h2>
      <p class="note">合言葉と、登録したニックネーム・屋号（名前）で入室します。ニックネームは一度決めたら変えられません。</p>
      <div class="field">
        <label for="passInput">合言葉</label>
        <input id="passInput" type="password" autocomplete="off" placeholder="合言葉を入力" />
      </div>
      <div class="field">
        <label for="nickInput">ニックネーム</label>
        <input id="nickInput" type="text" autocomplete="off" placeholder="例：講師" />
      </div>
      <div class="field">
        <label for="shopInput">屋号・名前</label>
        <input id="shopInput" type="text" autocomplete="off" placeholder="例：aigon.lab" />
      </div>
      <p class="err" id="entryErr"></p>
      <button class="btn-gold" id="enterBtn">入室する</button>
    </div>

    <div class="entry-card" id="adminEntry" style="display:none">
      <h2>管理人入口</h2>
      <p class="note">管理人パスワードを入力してください。はじめて使うときは、ここで決めたものが管理人パスワードになります。</p>
      <div class="field">
        <label for="adminPassInput">管理人パスワード（4文字以上）</label>
        <input id="adminPassInput" type="password" autocomplete="off" placeholder="管理人パスワード" />
      </div>
      <p class="err" id="adminErr"></p>
      <button class="btn-gold" id="adminEnterBtn">管理人として入室</button>
      <button class="btn-sub" id="adminBackBtn" style="width:100%;margin-top:10px">もどる</button>
    </div>

    <p class="foot">合言葉を知っている人だけの、小さな会員部屋です。<br>会話はニックネームだけで行います。</p>
  </section>

  <!-- ===== 部屋 ===== -->
  <section class="room" id="roomScreen">
    <div class="topbar">
      <span class="screen-name" id="screenName">会話</span>
      <span class="who"><span id="whoName">講師 さん</span> <span class="badge-admin" id="adminBadge" style="display:none">管理人</span></span>
      <button class="icon-btn" id="menuBtn" aria-label="メニュー">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>

    <!-- 会話 -->
    <div class="view on" id="view-chat">
      <div class="scroll"><div class="msgs" id="msgList"></div></div>
      <div class="pending" id="pendingBar">
        <img id="pendingImg" alt="添付予定の写真" style="display:none" />
        <span id="pendingName"></span>
        <button id="pendingClear">やめる</button>
      </div>
      <div class="composer">
        <button class="plus-btn" id="plusBtn" aria-label="添付">＋</button>
        <textarea id="msgInput" rows="1" placeholder="メッセージ"></textarea>
        <button class="send-btn" id="sendBtn">送信</button>
      </div>
    </div>

    <!-- プロンプト集 -->
    <div class="view" id="view-prompts">
      <div class="scroll">
        <div id="promptListWrap">
          <div class="list-head">
            <p>よく使う指示文を集めた場所です。開いて本文をコピーして使います。</p>
            <button class="add-btn" data-add="prompt">＋ 登録</button>
          </div>
          <div id="promptList"></div>
        </div>
        <div id="promptDetail" style="display:none"></div>
        <div id="promptFormWrap" style="display:none"></div>
      </div>
    </div>

    <!-- ツール倉庫 -->
    <div class="view" id="view-tools">
      <div class="scroll">
        <div id="toolListWrap">
          <div class="list-head">
            <p>テンプレート・指示文・チェックリスト・コードをしまう倉庫です。本文をコピーして使います。</p>
            <button class="add-btn" data-add="tool">＋ 登録</button>
          </div>
          <div id="toolList"></div>
        </div>
        <div id="toolDetail" style="display:none"></div>
        <div id="toolFormWrap" style="display:none"></div>
      </div>
    </div>

    <!-- 設定 -->
    <div class="view" id="view-settings">
      <div class="scroll" id="settingsScroll"></div>
    </div>
  </section>
</div>

<!-- ＋の引き出し -->
<div class="sheet-veil" id="sheetVeil"></div>
<div class="sheet" id="attachSheet" role="dialog" aria-label="添付">
  <div class="grab"></div>
  <button class="row" id="actCamera">
    <svg viewBox="0 0 24 24" fill="none" stroke="#eccd6d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.4"/></svg>
    写真を撮る
  </button>
  <button class="row" id="actPhoto">
    <svg viewBox="0 0 24 24" fill="none" stroke="#eccd6d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-4 4 3 3-2 4 3"/></svg>
    写真を選ぶ
  </button>
  <button class="row" id="actFile">
    <svg viewBox="0 0 24 24" fill="none" stroke="#eccd6d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3.5h7L19 8.5V20.5H7z"/><path d="M14 3.5v5h5"/></svg>
    ファイルを選ぶ
  </button>
</div>

<!-- ハンバーガーメニュー -->
<div class="sheet-veil" id="menuVeil"></div>
<nav class="menu" id="mainMenu" aria-label="メニュー">
  <div class="close-row">
    <button class="icon-btn" id="menuClose" aria-label="閉じる">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <h3>メニュー</h3>
  <button data-nav="chat" class="cur">会話</button>
  <button data-nav="prompts">プロンプト集</button>
  <button data-nav="tools">ツール倉庫</button>
  <button data-nav="settings">設定</button>
</nav>

<!-- カメラ -->
<div class="cam-veil" id="camVeil">
  <video id="camVideo" autoplay playsinline muted></video>
  <div class="cam-bar">
    <button class="cam-cancel" id="camCancel">やめる</button>
    <button class="cam-shot" id="camShot">撮る</button>
  </div>
</div>

<!-- 写真の拡大 -->
<div class="zoom-veil" id="zoomVeil">
  <img id="zoomImg" alt="拡大した写真" />
  <button id="zoomClose">✕ 閉じる</button>
</div>

<input type="file" id="photoInput" class="hidden-input" accept="image/*" />
<input type="file" id="fileInput" class="hidden-input" />
<canvas id="camCanvas" style="display:none"></canvas>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function toast(msg){
    var t = $("toast"); t.textContent = msg; t.classList.add("on");
    clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove("on"); }, 2400);
  }
  function nowTime(){ var d=new Date(); return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2); }

  /* ===== 状態（このページを開いている間だけ保持） ===== */
  var me = { nick:"", shop:"", admin:false };
  var roomPass = "";        // 最初に入室した人の合言葉が、この部屋の合言葉になる
  var adminPass = "";       // 管理人パスワード（初回に設定）
  var ledger = [];          // 会員台帳
  var messages = [];
  var prompts = [];
  var tools = [];
  var pending = null;       // {kind:'image'|'file', url, name}
  var msgSeq = 0, itemSeq = 0;

  /* ===== 最初から入っている見本データ ===== */
  function seed(){
    ledger.push({ nick:"講師", shop:"aigon.lab", date:"2026年11月24日", status:"in" });
    messages.push(
      { id:++msgSeq, nick:"講師", text:"フェイスミニブックへようこそ。ここは合言葉を知っている人だけの部屋です。", time:"18:40", reactions:{}, mine:false },
      { id:++msgSeq, nick:"講師", text:"写真は小さく表示され、タップすると大きくなります。リアクションは1人1つまで、付け替えと取り消しができます。", time:"18:41", reactions:{"👍":["店主"]}, mine:false }
    );
    prompts.push({
      id:++itemSeq, kind:"prompt", title:"お店の紹介文を作る", desc:"店の特徴から、ホームページ用の紹介文を作る指示文です。", cat:"集客",
      body:"あなたは小さなお店の広報担当です。\n次の情報をもとに、初めてのお客様に伝わる紹介文を300字で書いてください。\n\n・店名：\n・場所：\n・自慢の点：\n・こんな人に来てほしい：", by:"講師", url:"", shared:true
    });
    tools.push({
      id:++itemSeq, kind:"tool", title:"税込価格かんたん計算", desc:"税抜き金額から税込（10%・8%）を出す小さなコードです。本文をコピーして、ファイル名を「計算.html」にして保存するとブラウザで動きます。", cat:"経理",
      body:"<!DOCTYPE html>\n<html lang=\"ja\">\n<head><meta charset=\"utf-8\"><title>税込価格計算<\/title><\/head>\n<body>\n<h3>税込価格かんたん計算<\/h3>\n<input id=\"price\" type=\"number\" placeholder=\"税抜き金額\">\n<button onclick=\"calc()\">計算<\/button>\n<p id=\"out\"><\/p>\n<script>\nfunction calc(){\n  const p = Number(document.getElementById('price').value);\n  const t10 = Math.floor(p * 1.10);\n  const t8 = Math.floor(p * 1.08);\n  document.getElementById('out').textContent =\n    '10%税込：' + t10.toLocaleString() + '円 ／ 8%税込：' + t8.toLocaleString() + '円';\n}\n<\/script>\n<\/body>\n<\/html>",
      by:"講師", url:"", shared:true
    });
  }
  seed();

  /* ===== 入室 ===== */
  var keyTaps = 0, keyTimer = null;
  $("keyMedallion").addEventListener("click", function(){
    keyTaps++;
    clearTimeout(keyTimer);
    keyTimer = setTimeout(function(){ keyTaps = 0; }, 1600);
    if(keyTaps >= 5){
      keyTaps = 0;
      $("memberEntry").style.display = "none";
      $("adminEntry").style.display = "block";
      $("adminPassInput").focus();
    }
  });
  $("adminBackBtn").addEventListener("click", function(){
    $("adminEntry").style.display = "none";
    $("memberEntry").style.display = "block";
  });

  function enterRoom(admin){
    $("entryScreen").style.display = "none";
    $("roomScreen").classList.add("on");
    $("whoName").textContent = me.nick + " さん";
    $("adminBadge").style.display = admin ? "inline-block" : "none";
    renderMessages(); renderList("prompt"); renderList("tool"); renderSettings();
    showView("chat");
  }

  $("enterBtn").addEventListener("click", function(){
    var pass = $("passInput").value.trim();
    var nick = $("nickInput").value.trim();
    var shop = $("shopInput").value.trim();
    var err = $("entryErr");
    if(!pass){ err.textContent = "合言葉を入れてください。"; return; }
    if(!nick){ err.textContent = "ニックネームを入れてください。"; return; }
    if(!shop){ err.textContent = "屋号・名前を入れてください。"; return; }
    if(roomPass && pass !== roomPass){ err.textContent = "合言葉が違います。"; return; }
    var found = null;
    for(var i=0;i<ledger.length;i++){ if(ledger[i].nick === nick) found = ledger[i]; }
    if(found && found.status === "out"){ err.textContent = "このニックネームは退室済みのため入室できません。"; return; }
    if(found && found.shop !== shop){ err.textContent = "屋号・名前が登録と違います。"; return; }
    if(!roomPass) roomPass = pass;
    if(!found){
      var d = new Date();
      ledger.push({ nick:nick, shop:shop, date:d.getFullYear()+"年"+(d.getMonth()+1)+"月"+d.getDate()+"日", status:"in" });
    }
    me = { nick:nick, shop:shop, admin:false };
    err.textContent = "";
    enterRoom(false);
  });

  $("adminEnterBtn").addEventListener("click", function(){
    var p = $("adminPassInput").value;
    var err = $("adminErr");
    if(p.length < 4){ err.textContent = "4文字以上で入力してください。"; return; }
    if(adminPass && p !== adminPass){ err.textContent = "管理人パスワードが違います。"; return; }
    if(!adminPass) adminPass = p;
    me = { nick:"講師", shop:"aigon.lab", admin:true };
    err.textContent = "";
    enterRoom(true);
  });

  /* ===== 画面切り替え・メニュー ===== */
  var viewNames = { chat:"会話", prompts:"プロンプト集", tools:"ツール倉庫", settings:"設定" };
  function showView(v){
    ["chat","prompts","tools","settings"].forEach(function(k){
      $("view-"+k).classList.toggle("on", k === v);
    });
    $("screenName").textContent = viewNames[v];
    document.querySelectorAll("[data-nav]").forEach(function(b){
      b.classList.toggle("cur", b.getAttribute("data-nav") === v);
    });
    closeMenu();
  }
  var menuTimer = null;
  function openMenu(){
    var m = $("mainMenu");
    clearTimeout(menuTimer);
    m.classList.add("prep");
    void m.offsetWidth; /* 表示を確定させてからスライドさせる */
    m.classList.add("on");
    $("menuVeil").classList.add("on");
  }
  function closeMenu(){
    var m = $("mainMenu");
    m.classList.remove("on");
    $("menuVeil").classList.remove("on");
    clearTimeout(menuTimer);
    menuTimer = setTimeout(function(){ m.classList.remove("prep"); }, 300);
  }
  $("menuBtn").addEventListener("click", openMenu);
  $("menuClose").addEventListener("click", closeMenu);
  $("menuVeil").addEventListener("click", closeMenu);
  document.querySelectorAll("[data-nav]").forEach(function(b){
    b.addEventListener("click", function(){ showView(b.getAttribute("data-nav")); });
  });

  /* ===== 会話 ===== */
  var REACTS = ["👏","🙏","😄","👍"];
  function renderMessages(){
    var wrap = $("msgList");
    wrap.innerHTML = "";
    messages.forEach(function(m){
      var row = document.createElement("div");
      row.className = "msg" + (m.mine ? " own" : "");
      var chips = "";
      REACTS.forEach(function(r){
        var who = m.reactions[r] || [];
        if(who.length){
          chips += '<button class="chip' + (who.indexOf(me.nick) >= 0 ? " mine" : "") + '" data-react="' + r + '" data-id="' + m.id + '">' + r + " " + who.length + "</button>";
        }
      });
      var attach = "";
      if(m.image) attach = '<img class="thumb" src="' + m.image + '" alt="投稿された写真" data-zoom="1" />';
      if(m.file) attach = '<div class="filechip" data-file="1">📄 <span>' + esc(m.file) + "</span></div>";
      row.innerHTML =
        '<div class="avatar">' + esc(m.nick.charAt(0) || "店") + "</div>" +
        '<div class="msg-col">' +
          (m.mine ? "" : '<p class="msg-name">' + esc(m.nick) + "</p>") +
          '<div class="bubble">' + attach + esc(m.text) + "</div>" +
          '<div class="chips">' + chips + '<button class="react-add" data-picker="' + m.id + '" aria-label="リアクション">☺</button></div>' +
          '<div class="picker" id="picker-' + m.id + '">' + REACTS.map(function(r){ return '<button data-react="' + r + '" data-id="' + m.id + '">' + r + "</button>"; }).join("") + "</div>" +
          '<div class="msg-meta"><span>' + esc(m.time) + "</span>" + (m.mine ? '<button data-del="' + m.id + '">削除</button>' : "") + "</div>" +
        "</div>";
      wrap.appendChild(row);
    });
    var sc = wrap.closest(".scroll");
    if(sc) sc.scrollTop = sc.scrollHeight;
  }

  $("msgList").addEventListener("click", function(e){
    var t = e.target;
    var zoom = t.closest("[data-zoom]");
    if(zoom){ $("zoomImg").src = zoom.src; $("zoomVeil").classList.add("on"); return; }
    var pk = t.closest("[data-picker]");
    if(pk){
      var p = $("picker-" + pk.getAttribute("data-picker"));
      var was = p.classList.contains("on");
      document.querySelectorAll(".picker").forEach(function(x){ x.classList.remove("on"); });
      if(!was) p.classList.add("on");
      return;
    }
    var rc = t.closest("[data-react]");
    if(rc){ toggleReaction(Number(rc.getAttribute("data-id")), rc.getAttribute("data-react")); return; }
    var del = t.closest("[data-del]");
    if(del){
      var id = Number(del.getAttribute("data-del"));
      messages = messages.filter(function(m){ return m.id !== id; });
      renderMessages();
      toast("削除しました");
    }
  });
  function toggleReaction(id, r){
    for(var i=0;i<messages.length;i++){
      if(messages[i].id !== id) continue;
      var m = messages[i];
      REACTS.forEach(function(k){
        var arr = m.reactions[k] || [];
        var idx = arr.indexOf(me.nick);
        if(k === r){ if(idx >= 0) arr.splice(idx,1); else arr.push(me.nick); }
        else if(idx >= 0) arr.splice(idx,1);
        m.reactions[k] = arr;
      });
    }
    document.querySelectorAll(".picker").forEach(function(x){ x.classList.remove("on"); });
    renderMessages();
  }
  $("zoomClose").addEventListener("click", function(){ $("zoomVeil").classList.remove("on"); });
  $("zoomVeil").addEventListener("click", function(e){ if(e.target === this) this.classList.remove("on"); });

  function setPending(p){
    pending = p;
    var bar = $("pendingBar");
    if(!p){ bar.classList.remove("on"); return; }
    bar.classList.add("on");
    if(p.kind === "image"){ $("pendingImg").src = p.url; $("pendingImg").style.display = "block"; $("pendingName").textContent = "写真を添付します"; }
    else { $("pendingImg").style.display = "none"; $("pendingName").textContent = "ファイル：" + p.name; }
  }
  $("pendingClear").addEventListener("click", function(){ setPending(null); });

  function sendMessage(){
    var text = $("msgInput").value.trim();
    if(!text && !pending){ toast("メッセージを入力してください"); return; }
    var m = { id:++msgSeq, nick:me.nick, text:text, time:nowTime(), reactions:{}, mine:true };
    if(pending && pending.kind === "image") m.image = pending.url;
    if(pending && pending.kind === "file") m.file = pending.name;
    messages.push(m);
    $("msgInput").value = ""; $("msgInput").style.height = "auto";
    setPending(null);
    renderMessages();
  }
  $("sendBtn").addEventListener("click", sendMessage);
  $("msgInput").addEventListener("keydown", function(e){
    if(e.key === "Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); sendMessage(); }
  });
  $("msgInput").addEventListener("input", function(){
    this.style.height = "auto"; this.style.height = Math.min(this.scrollHeight, 120) + "px";
  });

  /* ===== 添付の引き出し・カメラ ===== */
  function openSheet(){ $("attachSheet").classList.add("on"); $("sheetVeil").classList.add("on"); }
  function closeSheet(){ $("attachSheet").classList.remove("on"); $("sheetVeil").classList.remove("on"); }
  $("plusBtn").addEventListener("click", openSheet);
  $("sheetVeil").addEventListener("click", closeSheet);

  $("actPhoto").addEventListener("click", function(){ closeSheet(); $("photoInput").click(); });
  $("actFile").addEventListener("click", function(){ closeSheet(); $("fileInput").click(); });
  $("photoInput").addEventListener("change", function(){
    var f = this.files && this.files[0]; this.value = "";
    if(!f) return;
    var rd = new FileReader();
    rd.onload = function(){ setPending({ kind:"image", url:rd.result }); toast("写真を添付しました"); };
    rd.readAsDataURL(f);
  });
  $("fileInput").addEventListener("change", function(){
    var f = this.files && this.files[0]; this.value = "";
    if(!f) return;
    if(f.size > 4 * 1024 * 1024){ toast("ファイルは4MBまでです"); return; }
    setPending({ kind:"file", name:f.name });
    toast("ファイルを添付しました");
  });

  var camStream = null;
  $("actCamera").addEventListener("click", function(){
    closeSheet();
    if(navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
      navigator.mediaDevices.getUserMedia({ video:{ facingMode:"environment" }, audio:false })
        .then(function(stream){
          camStream = stream;
          $("camVideo").srcObject = stream;
          $("camVeil").classList.add("on");
        })
        .catch(function(){
          toast("画面内カメラが使えないため、通常のカメラを開きます。撮った写真が届かない場合は「写真を選ぶ」から選び直せます。");
          var inp = $("photoInput"); inp.setAttribute("capture","environment"); inp.click(); inp.removeAttribute("capture");
        });
    } else {
      toast("この環境では画面内カメラが使えません。「写真を選ぶ」から選んでください。");
    }
  });
  function stopCam(){
    if(camStream){ camStream.getTracks().forEach(function(t){ t.stop(); }); camStream = null; }
    $("camVeil").classList.remove("on");
  }
  $("camCancel").addEventListener("click", stopCam);
  $("camShot").addEventListener("click", function(){
    var v = $("camVideo"), c = $("camCanvas");
    if(!v.videoWidth){ stopCam(); return; }
    c.width = v.videoWidth; c.height = v.videoHeight;
    c.getContext("2d").drawImage(v, 0, 0);
    var url = c.toDataURL("image/jpeg", 0.85);
    stopCam();
    setPending({ kind:"image", url:url });
    toast("撮影しました");
  });

  /* ===== プロンプト集・ツール倉庫 ===== */
  function listOf(kind){ return kind === "prompt" ? prompts : tools; }
  function renderList(kind){
    var wrap = $(kind + "List");
    var arr = listOf(kind);
    wrap.innerHTML = "";
    var shown = 0;
    arr.forEach(function(it){
      // 未公開のものは、作った人と管理人にしか見えない（公開前に作ったものは共有されない）
      if(!it.shared && !me.admin && it.by !== me.nick) return;
      shown++;
      var d = document.createElement("div");
      d.className = "card";
      d.innerHTML =
        (it.img ? '<img class="card-img" src="' + it.img + '" alt="" />' : "") +
        "<h3>" + esc(it.title) + "</h3>" +
        (it.desc ? "<p>" + esc(it.desc) + "</p>" : "") +
        '<div class="meta">' + (it.cat ? '<span class="tag">' + esc(it.cat) + '</span>' : "") +
        (it.shared ? '<span class="tag">公開中</span>' : '<span class="tag-private">未公開</span>') +
        '<span class="by">' + esc(it.by) + " さん</span></div>";
      d.addEventListener("click", function(){ showDetail(kind, it.id); });
      wrap.appendChild(d);
    });
    if(!shown){ wrap.innerHTML = '<div class="card"><p>まだ表示できる登録がありません。「＋ 登録」から追加できます。登録したものは最初は未公開で、作った人と管理人だけに見えます。</p></div>'; return; }
  }
  function findItem(kind, id){
    var arr = listOf(kind);
    for(var i=0;i<arr.length;i++) if(arr[i].id === id) return arr[i];
    return null;
  }
  function showDetail(kind, id){
    var it = findItem(kind, id); if(!it) return;
    $(kind + "ListWrap").style.display = "none";
    $(kind + "FormWrap").style.display = "none";
    var box = $(kind + "Detail");
    box.style.display = "block";
    var canEdit = me.admin || it.by === me.nick;
    box.innerHTML =
      '<button class="back-link" data-back="' + kind + '">← 一覧にもどる</button>' +
      '<div class="detail">' +
        "<h2>" + esc(it.title) + "</h2>" +
        (it.desc ? '<p class="desc">' + esc(it.desc) + "</p>" : "") +
        (it.img ? '<img src="' + it.img + '" alt="" />' : "") +
        '<div class="meta" style="margin-bottom:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">' + (it.cat ? '<span class="tag">' + esc(it.cat) + "</span>" : "") + (it.shared ? '<span class="tag">公開中</span>' : '<span class="tag-private">未公開</span>') + '<span class="by" style="color:var(--muted-2);font-size:.8rem">' + esc(it.by) + " さん</span></div>" +
        (it.shared ? "" : '<p style="color:var(--muted);font-size:.88rem;margin:0 0 14px;line-height:1.7">これは未公開です。作った人と管理人だけが見られます。相手に見せたいときは「相手に開示する」を押してください。</p>') +
        '<pre class="body">' + esc(it.body) + "</pre>" +
        '<div class="actions">' +
          '<button class="btn-gold" style="width:auto;padding:12px 26px" data-copy="' + kind + ":" + it.id + '">本文をコピー</button>' +
          (it.url ? '<button class="btn-sub" data-openurl="' + esc(it.url) + '">関連サイト</button>' : "") +
          (canEdit ? '<button class="btn-sub" data-share="' + kind + ":" + it.id + '">' + (it.shared ? "開示を取り消す" : "相手に開示する") + "</button>" : "") +
          (canEdit ? '<button class="btn-sub" data-edit="' + kind + ":" + it.id + '">編集</button><button class="btn-danger" data-delitem="' + kind + ":" + it.id + '">削除</button>' : "") +
        "</div>" +
        '<p style="color:var(--muted-2);font-size:.82rem;margin-top:14px;line-height:1.7">コピーは本文だけを取ります（改行・箇条書きそのまま）。</p>' +
      "</div>";
  }
  function backToList(kind){
    $(kind + "Detail").style.display = "none";
    $(kind + "FormWrap").style.display = "none";
    $(kind + "ListWrap").style.display = "block";
    renderList(kind);
  }
  function showForm(kind, it){
    $(kind + "ListWrap").style.display = "none";
    $(kind + "Detail").style.display = "none";
    var box = $(kind + "FormWrap");
    box.style.display = "block";
    var isTool = kind === "tool";
    box.innerHTML =
      '<button class="back-link" data-back="' + kind + '">← 一覧にもどる</button>' +
      '<form class="tool-form" data-form="' + kind + '" data-editid="' + (it ? it.id : "") + '">' +
        '<div class="field"><label>名前（必須）</label><input name="title" value="' + esc(it ? it.title : "") + '" placeholder="' + (isTool ? "例：料金シミュレーター" : "例：紹介文を作る") + '" /></div>' +
        '<div class="field"><label>説明（任意）</label><input name="desc" value="' + esc(it ? it.desc : "") + '" placeholder="何に使うものか、ひとことで" /></div>' +
        '<div class="field"><label>分類（任意）</label><input name="cat" value="' + esc(it ? it.cat : "") + '" placeholder="' + (isTool ? "例：経理" : "例：集客") + '" /></div>' +
        '<div class="field"><label>本文' + (isTool ? "（本文型では必須）" : "（必須）") + '</label><textarea name="body" placeholder="コピーして使うテンプレート・指示文・チェックリスト・コードなどをそのまま書いてください">' + esc(it ? it.body : "") + "</textarea></div>" +
        '<div class="field"><label>関連URL（任意）</label><input name="url" value="' + esc(it ? it.url : "") + '" placeholder="https://…" /></div>' +
        '<div class="field"><label>開示の設定</label><select name="shared">' +
          '<option value="0"' + (it && it.shared ? "" : " selected") + '>未公開（作った人と管理人だけが見られます）</option>' +
          '<option value="1"' + (it && it.shared ? " selected" : "") + '>公開（部屋のみんなに開示します）</option>' +
        "</select></div>" +
        '<button class="btn-gold" type="submit">' + (it ? "保存する" : "登録する") + "</button>" +
      "</form>";
  }

  document.querySelectorAll("[data-add]").forEach(function(b){
    b.addEventListener("click", function(){ showForm(b.getAttribute("data-add"), null); });
  });

  document.addEventListener("click", function(e){
    var t = e.target;
    var back = t.closest("[data-back]"); if(back){ backToList(back.getAttribute("data-back")); return; }
    var cp = t.closest("[data-copy]");
    if(cp){
      var parts = cp.getAttribute("data-copy").split(":");
      var it = findItem(parts[0], Number(parts[1]));
      if(it) copyText(it.body);
      return;
    }
    var ou = t.closest("[data-openurl]"); if(ou){ window.open(ou.getAttribute("data-openurl"), "_blank"); return; }
    var sh = t.closest("[data-share]");
    if(sh){
      var p4 = sh.getAttribute("data-share").split(":");
      var it4 = findItem(p4[0], Number(p4[1]));
      if(it4){
        it4.shared = !it4.shared;
        showDetail(p4[0], it4.id);
        toast(it4.shared ? "開示しました。部屋のみんなに見えるようになりました" : "未公開に戻しました");
      }
      return;
    }
    var ed = t.closest("[data-edit]");
    if(ed){ var p2 = ed.getAttribute("data-edit").split(":"); showForm(p2[0], findItem(p2[0], Number(p2[1]))); return; }
    var di = t.closest("[data-delitem]");
    if(di){
      var p3 = di.getAttribute("data-delitem").split(":");
      var arr = listOf(p3[0]);
      var id = Number(p3[1]);
      for(var i=arr.length-1;i>=0;i--) if(arr[i].id === id) arr.splice(i,1);
      backToList(p3[0]);
      toast("削除しました");
      return;
    }
  });
  document.addEventListener("submit", function(e){
    var f = e.target.closest("[data-form]");
    if(!f) return;
    e.preventDefault();
    var kind = f.getAttribute("data-form");
    var title = f.elements.namedItem("title").value.trim(), body = f.elements.namedItem("body").value;
    var descV = f.elements.namedItem("desc").value.trim();
    var catV = f.elements.namedItem("cat").value.trim();
    var urlV = f.elements.namedItem("url").value.trim();
    var sharedV = f.elements.namedItem("shared").value === "1";
    if(!title){ toast("名前を入れてください"); return; }
    if(!body.trim()){ toast("本文を入れてください"); return; }
    var editId = f.getAttribute("data-editid");
    if(editId){
      var it = findItem(kind, Number(editId));
      if(it){ it.title = title; it.desc = descV; it.cat = catV; it.body = body; it.url = urlV; it.shared = sharedV; }
      toast("保存しました");
    } else {
      listOf(kind).unshift({ id:++itemSeq, kind:kind, title:title, desc:descV, cat:catV, body:body, by:me.nick, url:urlV, shared:sharedV });
      toast("登録しました");
    }
    backToList(kind);
  });

  function copyText(text){
    function done(ok){ toast(ok ? "本文をコピーしました" : "コピーできませんでした。本文を長押しして選んでください"); }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ done(true); }, function(){ fallback(); });
    } else fallback();
    function fallback(){
      var ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch(err){ ok = false; }
      document.body.removeChild(ta);
      done(ok);
    }
  }

    if(inst){
      if(window.__deferredInstall) inst.style.display = "block";
      inst.addEventListener("click", function(){
        if(window.__promptInstall) window.__promptInstall();
        else toast("この端末では、ブラウザのメニューから「ホーム画面に追加」を選んでください");
      });
    }
    if(leave) leave.addEventListener("click", function(){
      $("roomScreen").classList.remove("on");
      $("entryScreen").style.display = "flex";
      $("memberEntry").style.display = "block";
      $("adminEntry").style.display = "none";
      toast("部屋から出ました");
    });
    var csv = $("csvBtn");
    if(csv) csv.addEventListener("click", function(){
      var rows = ["ニックネーム,屋号・名前,登録日,状態"];
      ledger.forEach(function(r){ rows.push([r.nick, r.shop, r.date, r.status === "in" ? "在室中" : "退室"].join(",")); });
      var blob = new Blob(["\ufeff" + rows.join("\n")], { type:"text/csv" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = "会員台帳.csv"; a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
    });
    var cp2 = $("changePassBtn");
    if(cp2) cp2.addEventListener("click", function(){
      var v = $("newPass").value.trim();
      if(!v){ toast("新しい合言葉を入れてください"); return; }
      roomPass = v; $("newPass").value = "";
      toast("合言葉を変更しました");
    });
    var ca = $("changeAdminBtn");
    if(ca) ca.addEventListener("click", function(){
      var v = $("newAdminPass").value;
      if(v.length < 4){ toast("4文字以上で入れてください"); return; }
      adminPass = v; $("newAdminPass").value = "";
      toast("管理人パスワードを変更しました");
    });
    s.querySelectorAll("[data-force]").forEach(function(b){
      b.addEventListener("click", function(){
        var r = ledger[Number(b.getAttribute("data-force"))];
        if(r){ r.status = "out"; renderSettings(); toast(r.nick + " さんを強制退室させました"); }
      });
    });
  }
})();
